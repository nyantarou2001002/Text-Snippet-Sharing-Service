<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snippet Share</title>
    <style>
        #editor {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 0.375rem; /* Rounded corners */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script>
        window.MonacoEnvironment = {
            getWorkerUrl: function (workerId, label) {
                var workerUrl = 'data:text/javascript;charset=utf-8,';
                workerUrl += encodeURIComponent(`
                    self.MonacoEnvironment = {
                        baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.21.2/min/'
                    };
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.21.2/min/vs/base/worker/workerMain.js');
                `);
                return workerUrl;
            }
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.21.2/min/vs/loader.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="max-w-4xl mx-auto p-6 bg-white shadow-md rounded-lg mt-10">
        <h1 class="text-2xl font-bold mb-4 text-center">Share your Snippet</h1>

        <div class="mb-4">
            <label for="snippet-title" class="block text-sm font-medium mb-1">Snippet Title:</label>
            <input type="text" id="snippet-title" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-indigo-500" placeholder="タイトルを記入してください">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label for="language-selector" class="block text-sm font-medium mb-1">Language:</label>
                <select id="language-selector" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-indigo-500">
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="php">PHP</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                </select>
            </div>

            <div>
                <label for="expiration-selector" class="block text-sm font-medium mb-1">Expiration:</label>
                <select id="expiration-selector" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-indigo-500">
                    <option value="10m">10 Minutes</option>
                    <option value="1h">1 Hour</option>
                    <option value="1d">1 Day</option>
                    <option value="never">Never</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <div id="editor" class="rounded"></div>
        </div>

        <div class="text-center">
            <button id="submit-btn" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 focus:outline-none focus:ring focus:ring-indigo-500">
                Submit Snippet
            </button>
        </div>
    </div>

    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.21.2/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            var editor = monaco.editor.create(document.getElementById('editor'), {
                value: '// Write your code here...',
                language: 'javascript',
                theme: 'vs-dark'
            });

            document.getElementById('language-selector').addEventListener('change', function() {
                var newLanguage = this.value;
                monaco.editor.setModelLanguage(editor.getModel(), newLanguage);
            });

            document.getElementById('submit-btn').addEventListener('click', function() {
                var snippetContent = editor.getValue();
                var selectedLanguage = document.getElementById('language-selector').value;
                var expiration = document.getElementById('expiration-selector').value;
                var snippetTitle = document.getElementById('snippet-title').value;

                fetch('/submit-snippet.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        content: snippetContent,
                        language: selectedLanguage,
                        expiration: expiration,
                        title: snippetTitle
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.url) {
                        alert('Your snippet is available at: ' + data.url);
                    } else {
                        alert('There was an error saving your snippet.');
                    }
                });
            });
        });
    </script>
</body>
</html>
